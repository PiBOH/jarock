# Jarock local launch settings. This file is copied to scripts/server-launch-settings.ini.
# RAM values must use a JVM suffix such as G or M and leave at least 1G for Windows and other applications.
RAM_INITIAL=1024M
RAM_MAX=8192M
GUI_MODE=nogui
AUTO_CONFIGURE_JAVA=true
GC_PROFILE=default
ONLINE_MODE=true
LOADER_TYPE=none
SHOW_READY_BANNER=true
AUTO_UPDATE_MODE=install
AUTO_UPDATE_CHECK=true








