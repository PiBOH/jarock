name: 🐛 Segnalazione Bug (Italiano)
description: Qualcosa non funziona? Aiutaci a sistemarlo!
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛠️ Segnalazione Bug
        Grazie per la segnalazione! Compila il modulo qui sotto con più dettagli possibile.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist preliminare
      options:
        - label: Sto usando l'[ultima release](https://github.com/PiBOH/jarock/releases/latest) di Jarock.
          required: true
        - label: Ho cercato tra le issue esistenti e ho verificato che questa non sia un duplicato.
          required: true
        - label: Ho letto le righe `ERROR:` e `Suggested fix:` stampate dal launcher.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: 📍 Dove si trova il bug?
      description: Seleziona l'area di Jarock in cui hai riscontrato il problema.
      options:
        - 🚀 start-server.bat (launcher / bootstrap)
        - ⚙️ parameter-manager.bat (editor impostazioni)
        - 🧵 Fabric loader / Fabric Installer
        - 🔨 NeoForge loader / NeoForge Installer
        - ☕ Rilevamento Java (java-runtime.ps1)
        - 📦 Manifest mod / download mod (Fabric o NeoForge)
        - 🧹 clean-server-runtime.bat (pulizia)
        - 🌐 Cross-play (Geyser / Floodgate)
        - 📄 Documentazione / sito web
        - 🏷️ Workflow auto-release
        - ❓ Altro
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 📉 Con che frequenza si verifica?
      options:
        - 🔴 Sempre (100%)
        - 🟠 Spesso (> 50%)
        - 🟡 A volte (< 50%)
        - 🟢 Raramente (una o due volte)
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 🔄 Passi per riprodurre il bug
      description: Passi chiari e precisi portano a una soluzione più veloce!
      placeholder: |
        1. Avvia start-server.bat dalla root del repository...
        2. Scegli Fabric come loader...
        3. Appare l'errore...
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 🆚 Comportamento atteso vs. Comportamento effettivo
      description: Cosa sarebbe dovuto succedere rispetto a cosa è successo.
      placeholder: |
        Atteso: Il server si avvia e genera il mondo.
        Effettivo: Il bootstrap mostra un errore e il server non si avvia.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"
  - type: dropdown
    id: os-ver
    attributes:
      label: 💻 Sistema operativo
      options:
        - 🪟 Windows 11
        - 🪟 Windows 10
        - 🪟 Windows Server
        - ❓ Altro
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: ☕ Versione Java in uso
      description: Incolla l'output di `java -version` o il percorso Java riportato da start-server.bat.
      placeholder: es. OpenJDK 25.0.4 (Eclipse Adoptium), 64-bit
    validations:
      required: true
  - type: dropdown
    id: loader-type
    attributes:
      label: 🧵 Loader selezionato
      description: Quale loader hai scelto in start-server.bat?
      options:
        - Fabric
        - NeoForge
        - Forge (non disponibile — solo informativo)
        - Nessuno / primo avvio
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 📄 Log / Screenshot
      description: Incolla l'output esatto del terminale, `server/logs/latest.log`, crash report, o trascina qui gli screenshot.
      render: shell
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 📎 Contesto aggiuntivo
      description: Qualcos'altro che potrebbe aiutare? (percorso Java personalizzato, antivirus, lunghezza del percorso, ecc.)
