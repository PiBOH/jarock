name: test-world-transfer

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/world-transfer.ps1'
      - 'scripts/test-world-transfer.ps1'
      - 'scripts/bootstrap-server.ps1'
      - 'scripts/run-server.ps1'
      - 'scripts/update-launch-setting.ps1'
      - 'scripts/validate-launch-settings.ps1'
      - 'scripts/server-launch-settings.ini.template'
      - 'parameter-manager.bat'
      - '.github/workflows/test-world-transfer.yml'
      - 'CHANGELOG.md'
      - 'scripts/version.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-transfer:
    name: Windows world import/export test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run world-transfer test with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-world-transfer.ps1 *> wt-51.log
          $code = $LASTEXITCODE
          Get-Content wt-51.log
          if ($code -ne 0) {
            $escaped = (Get-Content wt-51.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::world-transfer 5.1 test failed (exit $code):%0A$escaped"
          }
          exit $code

      - name: Run world-transfer test with PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File ./scripts/test-world-transfer.ps1 *> wt-7.log
          $code = $LASTEXITCODE
          Get-Content wt-7.log
          if ($code -ne 0) {
            $escaped = (Get-Content wt-7.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::world-transfer pwsh test failed (exit $code):%0A$escaped"
          }
          exit $code
