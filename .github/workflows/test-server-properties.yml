name: test-server-properties

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/server-properties.ps1'
      - 'scripts/test-server-properties.ps1'
      - 'scripts/run-server.ps1'
      - '.github/workflows/test-server-properties.yml'
      - 'CHANGELOG.md'
      - 'scripts/version.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-properties:
    name: Windows server.properties encoding test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run server-properties test with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-server-properties.ps1 *> sp-51.log
          $code = $LASTEXITCODE
          Get-Content sp-51.log
          if ($code -ne 0) {
            $escaped = (Get-Content sp-51.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::server-properties 5.1 test failed (exit $code):%0A$escaped"
          }
          exit $code

      - name: Run server-properties test with PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File ./scripts/test-server-properties.ps1 *> sp-7.log
          $code = $LASTEXITCODE
          Get-Content sp-7.log
          if ($code -ne 0) {
            $escaped = (Get-Content sp-7.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::server-properties pwsh test failed (exit $code):%0A$escaped"
          }
          exit $code
