name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest production deployment. A stale Pages deployment can
# remain queued on GitHub's side and block the next deployment indefinitely.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f .website/index.html
          test -f .website/styles.css
          test -f .website/script.js
          test -f .website/.nojekyll
          test -s .website/icon.png
          test "$(find .website -type f | wc -l)" -gt 0
          echo "Website files ready for upload:"
          find .website -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .website

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
