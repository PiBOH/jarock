name: auto-release.yml

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean
      version:
        description: Manual release version without the v prefix (workflow dispatch only; leave empty to use scripts/version.txt)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-tui:
    name: Build Windows TUI
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify Bun version
        shell: pwsh
        run: |
          $version = (bun --version).Trim()
          if ($version -ne '1.3.14') { throw "The workflow requires Bun 1.3.14 for baseline Windows compilation, but found Bun $version." }
          Write-Host "Using Bun $version for bun-windows-x64-baseline compilation."
      - name: Install TUI dependencies
        shell: pwsh
        run: bun install --cwd tui --frozen-lockfile
      - name: Verify OpenTUI Tree-sitter asset
        shell: pwsh
        run: |
          $asset = Join-Path $PWD 'tui/node_modules/web-tree-sitter/tree-sitter.wasm'
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "The web-tree-sitter WASM asset is missing after installation: $asset"
          }
          Write-Host "Tree-sitter WASM asset found: $asset"
      - name: Generate Jarock Windows icon
        shell: pwsh
        run: |
          python scripts/png-to-ico.py icon.png jarock-tui.ico
          if ($LASTEXITCODE -ne 0) { throw "Could not generate the Jarock Windows icon (exit code $LASTEXITCODE)." }
          if (-not (Test-Path -LiteralPath .\jarock-tui.ico -PathType Leaf)) { throw 'The generated Jarock Windows icon is missing.' }
      - name: Compile standalone Windows TUI
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location tui
          try {
            bun build --compile --target=bun-windows-x64-baseline --windows-icon=..\jarock-tui.ico index.ts --outfile ..\jarock-tui.exe
            if ($LASTEXITCODE -ne 0) {
              $code = $LASTEXITCODE
              Write-Host "Reason: Bun could not produce the standalone Windows TUI." -ForegroundColor Red
              Write-Host "The command uses the pre-2013 CPU baseline target and a legacy DIB ICO; inspect the Bun error above for missing assets, dependencies or compiler errors." -ForegroundColor Yellow
              Write-Host "Build command: bun build --compile --target=bun-windows-x64-baseline --windows-icon=..\jarock-tui.ico index.ts --outfile ..\jarock-tui.exe" -ForegroundColor Yellow
              throw "Bun failed to compile the Windows TUI (exit code $code)."
            }
          }
          finally { Pop-Location }
          if (-not (Test-Path -LiteralPath .\jarock-tui.exe -PathType Leaf)) { throw 'Bun did not create jarock-tui.exe.' }
      - name: Smoke test TUI executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\jarock-tui.exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) {
            Write-Host "Reason: the compiled TUI exited before initializing its renderer; this can indicate a missing native DLL, unsupported CPU instruction or incomplete package." -ForegroundColor Yellow
            throw "jarock-tui.exe smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke test native OpenTUI renderer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location tui
          try {
            bun build --compile --target=bun-windows-x64-baseline --windows-icon=..\jarock-tui.ico smoke.ts --outfile ..\jarock-tui-smoke.exe
            if ($LASTEXITCODE -ne 0) {
              $code = $LASTEXITCODE
              Write-Host "Reason: Bun could not produce the native OpenTUI smoke executable." -ForegroundColor Red
              Write-Host "The failure usually indicates a missing OpenTUI native backend, Tree-sitter asset or incompatible compiler input; inspect the Bun error above." -ForegroundColor Yellow
              Write-Host "Build command: bun build --compile --target=bun-windows-x64-baseline --windows-icon=..\jarock-tui.ico smoke.ts --outfile ..\jarock-tui-smoke.exe" -ForegroundColor Yellow
              throw "Bun failed to compile the native OpenTUI smoke test (exit code $code)."
            }
          }
          finally { Pop-Location }
          if (-not (Test-Path -LiteralPath .\jarock-tui-smoke.exe -PathType Leaf)) { throw 'Bun did not create jarock-tui-smoke.exe.' }
          $process = Start-Process -FilePath .\jarock-tui-smoke.exe -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) {
            Write-Host "Reason: the native OpenTUI renderer did not start; check the packaged Windows backend and CPU compatibility." -ForegroundColor Yellow
            throw "Native OpenTUI renderer smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Upload TUI executable
        uses: actions/upload-artifact@v4
        with:
          name: jarock-tui
          path: jarock-tui.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-tui
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Read and validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git diff --quiet HEAD^ HEAD -- scripts/version.txt && { echo 'scripts/version.txt must change in a release commit.' >&2; exit 1; }
          fi
          VERSION="$(tr -d '\r\n' < scripts/version.txt | xargs)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_VERSION}" ]]; then
            VERSION="$(printf '%s' "${MANUAL_VERSION}" | tr -d '\r\n' | xargs)"
            if [[ "$VERSION" == v* ]]; then
              echo 'The manual version must not start with v. Enter only the version number, for example 0.0.52-beta.' >&2
              exit 1
            fi
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION. Enter a SemVer value without the v prefix." >&2
            exit 1
          fi
          if ! awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { found = 1; exit } END { exit(found ? 0 : 1) }' CHANGELOG.md; then
            echo "CHANGELOG.md is missing the ## [${VERSION}] release section." >&2
            exit 1
          fi
          TAG="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; refusing to create a duplicate release." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag | grep -E '^[0-9]+[.][0-9]+[.][0-9]+' | sort -V | tail -n1 || true)"
          {
            echo "## Changes in this release"
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /'
            else
              git log --oneline --no-merges HEAD | sed 's/^/- /'
            fi
            echo ""
            echo "## Changelog"
            echo ""
          } > release-notes.md
          awk -v version="$VERSION" '
            BEGIN { target = "## [" version "]" ; in_section = 0 }
            index($0, target) == 1 { in_section = 1; print; next }
            in_section && $0 ~ /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md >> release-notes.md
          if ! grep -q '^## \[' release-notes.md; then
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' "${GITHUB_REPOSITORY}" >> release-notes.md
          fi

      - name: Validate PowerShell package encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [Path(name) for name in __import__('subprocess').check_output(['git', 'ls-files', '*.ps1'], text=True).splitlines()]
          bad = []
          for path in files:
              data = path.read_bytes()
              if any(byte >= 128 for byte in data):
                  bad.append(str(path))
          if bad:
              raise SystemExit('PowerShell files must be ASCII-safe for Windows PowerShell 5.1: ' + ', '.join(bad))
          print(f'Validated {len(files)} PowerShell files: ASCII-safe')
          PY

      - name: Download TUI executable
        uses: actions/download-artifact@v4
        with:
          name: jarock-tui
          path: .tui-artifact

      - name: Build release packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            CLI_FULL_NAME="jarock-cli-full-${VERSION}.zip"
            CLI_LITE_NAME="jarock-cli-lite-${VERSION}.zip"
            TUI_FULL_NAME="jarock-tui-full-${VERSION}.zip"
            TUI_LITE_NAME="jarock-tui-lite-${VERSION}.zip"
          else
            CLI_FULL_NAME="jarock-cli-full.zip"
            CLI_LITE_NAME="jarock-cli-lite.zip"
            TUI_FULL_NAME="jarock-tui-full.zip"
            TUI_LITE_NAME="jarock-tui-lite.zip"
          fi
          CLI_FULL_STAGE="$(mktemp -d)"
          CLI_LITE_STAGE="$(mktemp -d)"
          TUI_FULL_STAGE="$(mktemp -d)"
          TUI_LITE_STAGE="$(mktemp -d)"
          # Package the indispensable tracked files only: code, templates, manifests,
          # scripts, .bat launchers, all tracked project icons and the documentation in every
          # language. The full package also bundles the Java installers from
          # prerequisites/ (LFS); the lite package does not. Workflows (.github), the
          # website (.website) and version-control metadata (.gitattributes, .gitignore)
          # are excluded. The source TUI project is build-only; TUI release stages
          # receive the compiled Windows executable instead.
          for required in icon.png server/icon.png server/server-icon.png server/config/welcomemessage.json5.jarock scripts/jarock-edition.ini; do
            git ls-files --error-unmatch "$required" >/dev/null
            test -f "$required"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('server/icon.png', 'server/server-icon.png'):
              path = Path(name)
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name} is not a valid PNG file')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (64, 64):
                  raise SystemExit(f'{name} must be exactly 64x64, found {width}x{height}')
              print(f'{name}: validated as 64x64 PNG')
          PY
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|.website/*|.gitattributes|.gitignore) continue ;;
            esac
            case "$f" in
              tui/*) continue ;;
            esac
            mkdir -p "$CLI_FULL_STAGE/$(dirname "$f")"
            cp -p "$f" "$CLI_FULL_STAGE/$f"
            mkdir -p "$TUI_FULL_STAGE/$(dirname "$f")"
            cp -p "$f" "$TUI_FULL_STAGE/$f"
            case "$f" in
              prerequisites/*) continue ;;
            esac
            mkdir -p "$CLI_LITE_STAGE/$(dirname "$f")"
            cp -p "$f" "$CLI_LITE_STAGE/$f"
            mkdir -p "$TUI_LITE_STAGE/$(dirname "$f")"
            cp -p "$f" "$TUI_LITE_STAGE/$f"
          done
          for stage in "$CLI_FULL_STAGE" "$CLI_LITE_STAGE" "$TUI_FULL_STAGE" "$TUI_LITE_STAGE"; do
            cp -p "$stage/server/config/welcomemessage.json5.jarock" \
              "$stage/server/config/welcomemessage.json5.template-jarock"
          done
          printf 'JAROCK_INTERFACE=cli\nJAROCK_PACKAGE_TIER=full\n' > "$CLI_FULL_STAGE/scripts/jarock-edition.ini"
          printf 'JAROCK_INTERFACE=cli\nJAROCK_PACKAGE_TIER=lite\n' > "$CLI_LITE_STAGE/scripts/jarock-edition.ini"
          printf 'JAROCK_INTERFACE=tui\nJAROCK_PACKAGE_TIER=full\n' > "$TUI_FULL_STAGE/scripts/jarock-edition.ini"
          printf 'JAROCK_INTERFACE=tui\nJAROCK_PACKAGE_TIER=lite\n' > "$TUI_LITE_STAGE/scripts/jarock-edition.ini"
          # A manually dispatched version must be the version installed by the package too.
          for stage in "$CLI_FULL_STAGE" "$CLI_LITE_STAGE" "$TUI_FULL_STAGE" "$TUI_LITE_STAGE"; do
            printf '%s\n' "$VERSION" > "$stage/scripts/version.txt"
          done
          for stage in "$TUI_FULL_STAGE" "$TUI_LITE_STAGE"; do
            cp -p .tui-artifact/jarock-tui.exe "$stage/jarock-tui.exe"
            cp -p tui/LICENSE-OPENTUI.txt "$stage/LICENSE-OPENTUI.txt"
          done
          python3 - "$CLI_FULL_STAGE" "$CLI_FULL_NAME" "$CLI_LITE_STAGE" "$CLI_LITE_NAME" "$TUI_FULL_STAGE" "$TUI_FULL_NAME" "$TUI_LITE_STAGE" "$TUI_LITE_NAME" <<'PY'
          import shutil, sys
          for stage, archive in zip(sys.argv[1::2], sys.argv[2::2]): shutil.make_archive(archive[:-4], 'zip', stage)
          PY
          python3 - "$CLI_FULL_NAME" "$CLI_LITE_NAME" "$TUI_FULL_NAME" "$TUI_LITE_NAME" <<'PY'
          import sys, zipfile
          required = {'icon.png', 'server/icon.png', 'server/server-icon.png', 'server/config/welcomemessage.json5.jarock', 'server/config/welcomemessage.json5.template-jarock', 'scripts/jarock-edition.ini'}
          required_prerequisites = {'prerequisites/jre-8-windows-x64.exe', 'prerequisites/OpenJDK25U-jdk_x64_windows_hotspot.msi'}
          for archive_name in sys.argv[1:]:
              with zipfile.ZipFile(archive_name) as archive: names = set(archive.namelist())
              missing = required - names
              if missing: raise SystemExit(f'{archive_name} is missing required Jarock file(s): {sorted(missing)}')
              is_full = '-full' in archive_name
              has_prerequisites = any(name.startswith('prerequisites/') for name in names)
              if is_full and not required_prerequisites <= names: raise SystemExit(f'{archive_name} is missing bundled Java prerequisite installer(s): {sorted(required_prerequisites - names)}')
              if not is_full and has_prerequisites: raise SystemExit(f'{archive_name} unexpectedly contains bundled Java prerequisites')
              if 'tui-' in archive_name and 'jarock-tui.exe' not in names: raise SystemExit(f'{archive_name} is missing jarock-tui.exe')
              if 'tui-' not in archive_name and 'jarock-tui.exe' in names: raise SystemExit(f'{archive_name} unexpectedly contains jarock-tui.exe')
              print(f'{archive_name}: package validation passed')
          PY
          for archive in "$CLI_FULL_NAME" "$CLI_LITE_NAME" "$TUI_FULL_NAME" "$TUI_LITE_NAME"; do sha512sum "$archive" > "$archive.sha512"; done
          # Compatibility aliases keep pre-0.0.111 CLI installations updateable.
          # They point to the same content as the new CLI Full/Lite packages.
          LEGACY_FULL_NAME="${CLI_FULL_NAME/cli-full/full}"
          LEGACY_LITE_NAME="${CLI_LITE_NAME/cli-lite/lite}"
          cp -p "$CLI_FULL_NAME" "$LEGACY_FULL_NAME"
          cp -p "$CLI_LITE_NAME" "$LEGACY_LITE_NAME"
          sha512sum "$LEGACY_FULL_NAME" > "$LEGACY_FULL_NAME.sha512"
          sha512sum "$LEGACY_LITE_NAME" > "$LEGACY_LITE_NAME.sha512"
          {
            echo "cli_full_name=$CLI_FULL_NAME"
            echo "cli_lite_name=$CLI_LITE_NAME"
            echo "tui_full_name=$TUI_FULL_NAME"
            echo "tui_lite_name=$TUI_LITE_NAME"
            echo "cli_full_checksum=$CLI_FULL_NAME.sha512"
            echo "cli_lite_checksum=$CLI_LITE_NAME.sha512"
            echo "tui_full_checksum=$TUI_FULL_NAME.sha512"
            echo "tui_lite_checksum=$TUI_LITE_NAME.sha512"
            echo "legacy_full_name=$LEGACY_FULL_NAME"
            echo "legacy_lite_name=$LEGACY_LITE_NAME"
            echo "legacy_full_checksum=$LEGACY_FULL_NAME.sha512"
            echo "legacy_lite_checksum=$LEGACY_LITE_NAME.sha512"
          } >> "$GITHUB_OUTPUT"
          ls -la "$CLI_FULL_NAME" "$CLI_LITE_NAME" "$TUI_FULL_NAME" "$TUI_LITE_NAME" "$LEGACY_FULL_NAME" "$LEGACY_LITE_NAME" *.sha512

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jarock ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false
          files: |
            ${{ steps.package.outputs.cli_full_name }}
            ${{ steps.package.outputs.cli_lite_name }}
            ${{ steps.package.outputs.tui_full_name }}
            ${{ steps.package.outputs.tui_lite_name }}
            ${{ steps.package.outputs.cli_full_checksum }}
            ${{ steps.package.outputs.cli_lite_checksum }}
            ${{ steps.package.outputs.tui_full_checksum }}
            ${{ steps.package.outputs.tui_lite_checksum }}
            ${{ steps.package.outputs.legacy_full_name }}
            ${{ steps.package.outputs.legacy_lite_name }}
            ${{ steps.package.outputs.legacy_full_checksum }}
            ${{ steps.package.outputs.legacy_lite_checksum }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
