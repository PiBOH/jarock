# Publishes one release from main carrying the CLI packages.
#
# The version comes from scripts/jarock.ini (JAROCK_VERSION), which is the single
# version source. A push releases only when the commit message starts with "v",
# and a release commit must change that line.
#
# The Minecraft branches (mc-26.2, mc-26.3) never publish: they only run the test
# workflows. The Minecraft version is not part of the tag or the title because
# one package asks for it on the first start.
#
# TUI packages and jarock-tui.exe are no longer published: the TUI is
# unmaintained and the CLI editions are the only supported downloads.
name: auto-release.yml

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean
      version:
        description: Manual release version without the v prefix (workflow dispatch only; leave empty to use scripts/jarock.ini)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish the CLI packages
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Read and validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # The single version source must be bumped by the release commit.
            if ! git diff HEAD^ HEAD -- scripts/jarock.ini | grep -q '^+JAROCK_VERSION='; then
              echo 'scripts/jarock.ini must change JAROCK_VERSION in a release commit.' >&2
              exit 1
            fi
          fi
          VERSION="$(sed -n 's/^JAROCK_VERSION=//p' scripts/jarock.ini | tr -d '\r' | xargs)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_VERSION}" ]]; then
            VERSION="$(printf '%s' "${MANUAL_VERSION}" | tr -d '\r\n' | xargs)"
            if [[ "$VERSION" == v* ]]; then
              echo 'The manual version must not start with v. Enter only the version number, for example 0.1.0-beta.' >&2
              exit 1
            fi
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION. Enter a SemVer value without the v prefix." >&2
            exit 1
          fi
          if ! awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { found = 1; exit } END { exit(found ? 0 : 1) }' CHANGELOG.md; then
            echo "CHANGELOG.md is missing the ## [${VERSION}] release section." >&2
            exit 1
          fi
          TAG="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; refusing to create a duplicate release." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag | grep -E '^[0-9]+[.][0-9]+[.][0-9]+' | sort -V | tail -n1 || true)"
          {
            echo "## Changes in this release"
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /'
            else
              git log --oneline --no-merges HEAD | sed 's/^/- /'
            fi
            echo ""
            echo "## Download"
            echo ""
            echo "Both packages ask for the Minecraft version on the first start, so one download serves every supported line."
            echo "Use \`jarock-cli-full\` to get the Java installers, or \`jarock-cli-lite\` when Java 25 is already installed."
            echo ""
            echo "## Changelog"
            echo ""
          } > release-notes.md
          awk -v version="$VERSION" '
            BEGIN { target = "## [" version "]" ; in_section = 0 }
            index($0, target) == 1 { in_section = 1; print; next }
            in_section && $0 ~ /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md >> release-notes.md
          if ! grep -q '^## \[' release-notes.md; then
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' "${GITHUB_REPOSITORY}" >> release-notes.md
          fi

      - name: Validate PowerShell package encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = [Path(name) for name in subprocess.check_output(['git', 'ls-files', '*.ps1'], text=True).splitlines()]
          bad = []
          for path in files:
              data = path.read_bytes()
              if any(byte >= 128 for byte in data):
                  bad.append(str(path))
          if bad:
              raise SystemExit('PowerShell files must be ASCII-safe for Windows PowerShell 5.1: ' + ', '.join(bad))
          print(f'Validated {len(files)} PowerShell files: ASCII-safe')
          PY

      - name: Build release packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            CLI_FULL_NAME="jarock-cli-full-${VERSION}.zip"
            CLI_LITE_NAME="jarock-cli-lite-${VERSION}.zip"
          else
            CLI_FULL_NAME="jarock-cli-full.zip"
            CLI_LITE_NAME="jarock-cli-lite.zip"
          fi
          CLI_FULL_STAGE="$(mktemp -d)"
          CLI_LITE_STAGE="$(mktemp -d)"
          # Package the indispensable tracked files only: code, templates, manifests,
          # scripts, .bat launchers, all tracked project icons and the documentation in
          # every language. The full package also bundles the Java installers from
          # prerequisites/ (LFS); the lite package does not. Workflows (.github), the
          # website (.website), version-control metadata and the local configuration
          # cache are excluded.
          for required in icon.png server/icon.png server/server-icon.png server/config/welcomemessage.json5.jarock scripts/jarock-edition.ini scripts/jarock.ini; do
            git ls-files --error-unmatch "$required" >/dev/null
            test -f "$required"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('server/icon.png', 'server/server-icon.png'):
              path = Path(name)
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name} is not a valid PNG file')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (64, 64):
                  raise SystemExit(f'{name} must be exactly 64x64, found {width}x{height}')
              print(f'{name}: validated as 64x64 PNG')
          PY
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|.website/*|.gitattributes|.gitignore) continue ;;
              tui/*|AGENTS.md) continue ;;
            esac
            mkdir -p "$CLI_FULL_STAGE/$(dirname "$f")"
            cp -p "$f" "$CLI_FULL_STAGE/$f"
            case "$f" in
              prerequisites/*) continue ;;
            esac
            mkdir -p "$CLI_LITE_STAGE/$(dirname "$f")"
            cp -p "$f" "$CLI_LITE_STAGE/$f"
          done
          for stage in "$CLI_FULL_STAGE" "$CLI_LITE_STAGE"; do
            cp -p "$stage/server/config/welcomemessage.json5.jarock" \
              "$stage/server/config/welcomemessage.json5.template-jarock"
          done
          # CLI is the only published interface now.
          printf 'JAROCK_INTERFACE=cli\nJAROCK_PACKAGE_TIER=full\n' > "$CLI_FULL_STAGE/scripts/jarock-edition.ini"
          printf 'JAROCK_INTERFACE=cli\nJAROCK_PACKAGE_TIER=lite\n' > "$CLI_LITE_STAGE/scripts/jarock-edition.ini"
          # A manually dispatched version must be the version the package runs too.
          for stage in "$CLI_FULL_STAGE" "$CLI_LITE_STAGE"; do
            sed -i "s/^JAROCK_VERSION=.*/JAROCK_VERSION=${VERSION}/" "$stage/scripts/jarock.ini"
          done
          python3 - "$CLI_FULL_STAGE" "$CLI_FULL_NAME" "$CLI_LITE_STAGE" "$CLI_LITE_NAME" <<'PY'
          import shutil, sys
          for stage, archive in zip(sys.argv[1::2], sys.argv[2::2]): shutil.make_archive(archive[:-4], 'zip', stage)
          PY
          python3 - "$CLI_FULL_NAME" "$CLI_LITE_NAME" <<'PY'
          import sys, zipfile
          required = {'icon.png', 'server/icon.png', 'server/server-icon.png', 'server/config/welcomemessage.json5.jarock', 'server/config/welcomemessage.json5.template-jarock', 'scripts/jarock-edition.ini', 'scripts/jarock.ini'}
          required_prerequisites = {'prerequisites/jre-8-windows-x64.exe', 'prerequisites/OpenJDK25U-jdk_x64_windows_hotspot.msi'}
          for archive_name in sys.argv[1:]:
              with zipfile.ZipFile(archive_name) as archive: names = set(archive.namelist())
              missing = required - names
              if missing: raise SystemExit(f'{archive_name} is missing required Jarock file(s): {sorted(missing)}')
              is_full = '-full' in archive_name
              has_prerequisites = any(name.startswith('prerequisites/') for name in names)
              if is_full and not required_prerequisites <= names: raise SystemExit(f'{archive_name} is missing bundled Java prerequisite installer(s): {sorted(required_prerequisites - names)}')
              if not is_full and has_prerequisites: raise SystemExit(f'{archive_name} unexpectedly contains bundled Java prerequisites')
              if 'jarock-tui.exe' in names: raise SystemExit(f'{archive_name} unexpectedly contains jarock-tui.exe; the TUI is no longer published')
              print(f'{archive_name}: package validation passed')
          PY
          for archive in "$CLI_FULL_NAME" "$CLI_LITE_NAME"; do sha512sum "$archive" > "$archive.sha512"; done
          {
            echo "cli_full_name=$CLI_FULL_NAME"
            echo "cli_lite_name=$CLI_LITE_NAME"
            echo "cli_full_checksum=$CLI_FULL_NAME.sha512"
            echo "cli_lite_checksum=$CLI_LITE_NAME.sha512"
          } >> "$GITHUB_OUTPUT"
          ls -la "$CLI_FULL_NAME" "$CLI_LITE_NAME" *.sha512

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jarock ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false
          files: |
            ${{ steps.package.outputs.cli_full_name }}
            ${{ steps.package.outputs.cli_lite_name }}
            ${{ steps.package.outputs.cli_full_checksum }}
            ${{ steps.package.outputs.cli_lite_checksum }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
