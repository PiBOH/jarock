name: auto-release.yml

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean
      version:
        description: Manual release version without the v prefix (workflow dispatch only; leave empty to use scripts/version.txt)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Read and validate version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git diff --quiet HEAD^ HEAD -- scripts/version.txt && { echo 'scripts/version.txt must change in a release commit.' >&2; exit 1; }
          fi
          VERSION="$(tr -d '\r\n' < scripts/version.txt | xargs)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_VERSION}" ]]; then
            VERSION="$(printf '%s' "${MANUAL_VERSION}" | tr -d '\r\n' | xargs)"
            if [[ "$VERSION" == v* ]]; then
              echo 'The manual version must not start with v. Enter only the version number, for example 0.0.52-beta.' >&2
              exit 1
            fi
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION. Enter a SemVer value without the v prefix." >&2
            exit 1
          fi
          if ! awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { found = 1; exit } END { exit(found ? 0 : 1) }' CHANGELOG.md; then
            echo "CHANGELOG.md is missing the ## [${VERSION}] release section." >&2
            exit 1
          fi
          TAG="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; refusing to create a duplicate release." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag | grep -E '^[0-9]+[.][0-9]+[.][0-9]+' | sort -V | tail -n1 || true)"
          {
            echo "## Changes in this release"
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /'
            else
              git log --oneline --no-merges HEAD | sed 's/^/- /'
            fi
            echo ""
            echo "## Changelog"
            echo ""
          } > release-notes.md
          awk -v version="$VERSION" '
            BEGIN { target = "## [" version "]" ; in_section = 0 }
            index($0, target) == 1 { in_section = 1; print; next }
            in_section && $0 ~ /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md >> release-notes.md
          if ! grep -q '^## \[' release-notes.md; then
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' "${GITHUB_REPOSITORY}" >> release-notes.md
          fi

      - name: Validate PowerShell package encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [Path(name) for name in __import__('subprocess').check_output(['git', 'ls-files', '*.ps1'], text=True).splitlines()]
          bad = []
          for path in files:
              data = path.read_bytes()
              if any(byte >= 128 for byte in data):
                  bad.append(str(path))
          if bad:
              raise SystemExit('PowerShell files must be ASCII-safe for Windows PowerShell 5.1: ' + ', '.join(bad))
          print(f'Validated {len(files)} PowerShell files: ASCII-safe')
          PY

      - name: Build release packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            FULL_NAME="jarock-full-${VERSION}.zip"
            LITE_NAME="jarock-lite-${VERSION}.zip"
          else
            FULL_NAME="jarock-full.zip"
            LITE_NAME="jarock-lite.zip"
          fi
          FULL_STAGE="$(mktemp -d)"
          LITE_STAGE="$(mktemp -d)"
          # Package the indispensable tracked files only: code, templates, manifests,
          # scripts, .bat launchers, both project icons and the documentation in every
          # language. The full package also bundles the Java installers from
          # prerequisites/ (LFS); the lite package does not. Workflows (.github), the
          # website (.website) and version-control metadata (.gitattributes, .gitignore)
          # are excluded.
          for required in icon.png server/server-icon.png server/config/welcomemessage.json5.template-jarock; do
            git ls-files --error-unmatch "$required" >/dev/null
            test -f "$required"
          done
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|.website/*|.gitattributes|.gitignore) continue ;;
            esac
            mkdir -p "$FULL_STAGE/$(dirname "$f")"
            cp -p "$f" "$FULL_STAGE/$f"
            case "$f" in
              prerequisites/*) continue ;;
            esac
            mkdir -p "$LITE_STAGE/$(dirname "$f")"
            cp -p "$f" "$LITE_STAGE/$f"
          done
          python3 - "$FULL_STAGE" "$FULL_NAME" <<'PY'
          import shutil, sys
          shutil.make_archive(sys.argv[2][:-4], 'zip', sys.argv[1])
          PY
          python3 - "$LITE_STAGE" "$LITE_NAME" <<'PY'
          import shutil, sys
          shutil.make_archive(sys.argv[2][:-4], 'zip', sys.argv[1])
          PY
          python3 - "$FULL_NAME" "$LITE_NAME" <<'PY'
          import sys, zipfile
          required = {'icon.png', 'server/server-icon.png', 'server/config/welcomemessage.json5.template-jarock'}
          for archive_name in sys.argv[1:]:
              with zipfile.ZipFile(archive_name) as archive:
                  names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f'{archive_name} is missing required Jarock file(s): {sorted(missing)}')
              print(f'{archive_name}: Jarock icons and Welcome Message template are packaged')
          PY
          sha512sum "$FULL_NAME" > "$FULL_NAME.sha512"
          sha512sum "$LITE_NAME" > "$LITE_NAME.sha512"
          {
            echo "full_name=$FULL_NAME"
            echo "lite_name=$LITE_NAME"
            echo "full_checksum=$FULL_NAME.sha512"
            echo "lite_checksum=$LITE_NAME.sha512"
          } >> "$GITHUB_OUTPUT"
          ls -la "$FULL_NAME" "$LITE_NAME" "$FULL_NAME.sha512" "$LITE_NAME.sha512"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jarock ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false
          files: |
            ${{ steps.package.outputs.full_name }}
            ${{ steps.package.outputs.lite_name }}
            ${{ steps.package.outputs.full_checksum }}
            ${{ steps.package.outputs.lite_checksum }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
