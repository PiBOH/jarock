name: auto-release.yml

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Checkout LFS files (prerequisites installers)
        run: git lfs pull
        shell: bash

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git diff --quiet HEAD^ HEAD -- version.txt && { echo 'version.txt must change in a release commit.' >&2; exit 1; }
            git diff --quiet HEAD^ HEAD -- CHANGELOG.md && { echo 'CHANGELOG.md must change in a release commit.' >&2; exit 1; }
          fi
          VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in version.txt: $VERSION" >&2
            exit 1
          fi
          TAG="${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; refusing to create a duplicate release." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git tag | grep -E '^[0-9]+[.][0-9]+[.][0-9]+' | sort -V | tail -n1 || true)"
          {
            echo "## Changes in this release"
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /'
            else
              git log --oneline --no-merges HEAD | sed 's/^/- /'
            fi
            echo ""
            echo "## Changelog"
            echo ""
          } > release-notes.md
          awk -v version="$VERSION" '
            BEGIN { target = "## [" version "]" ; in_section = 0 }
            index($0, target) == 1 { in_section = 1; print; next }
            in_section && $0 ~ /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md >> release-notes.md
          if ! grep -q '^## \[' release-notes.md; then
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' "${GITHUB_REPOSITORY}" >> release-notes.md
          fi

      - name: Build release packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            FULL_NAME="jarock-full-${VERSION}.zip"
            LITE_NAME="jarock-lite-${VERSION}.zip"
          else
            FULL_NAME="jarock-full.zip"
            LITE_NAME="jarock-lite.zip"
          fi
          FULL_STAGE="$(mktemp -d)"
          LITE_STAGE="$(mktemp -d)"
          # Package the indispensable tracked files only: code, templates, manifests,
          # scripts, .bat launchers and the documentation in every language. The full
          # package also bundles the Java installers from prerequisites/ (LFS); the
          # lite package does not. Workflows (.github), the website (.website) and
          # version-control metadata (.gitattributes, .gitignore) are excluded.
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|.website/*|.gitattributes|.gitignore) continue ;;
            esac
            mkdir -p "$FULL_STAGE/$(dirname "$f")"
            cp -p "$f" "$FULL_STAGE/$f"
            case "$f" in
              prerequisites/*) continue ;;
            esac
            mkdir -p "$LITE_STAGE/$(dirname "$f")"
            cp -p "$f" "$LITE_STAGE/$f"
          done
          python3 - "$FULL_STAGE" "$FULL_NAME" <<'PY'
          import shutil, sys
          shutil.make_archive(sys.argv[2][:-4], 'zip', sys.argv[1])
          PY
          python3 - "$LITE_STAGE" "$LITE_NAME" <<'PY'
          import shutil, sys
          shutil.make_archive(sys.argv[2][:-4], 'zip', sys.argv[1])
          PY
          {
            echo "full_name=$FULL_NAME"
            echo "lite_name=$LITE_NAME"
          } >> "$GITHUB_OUTPUT"
          ls -la "$FULL_NAME" "$LITE_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jarock ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false
          files: |
            ${{ steps.package.outputs.full_name }}
            ${{ steps.package.outputs.lite_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
