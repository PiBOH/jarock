name: test-console-close

'on':
  push:
    branches: [ main ]
    paths:
      - 'scripts/console-close-protection.ps1'
      - 'scripts/test-console-close-protection.ps1'
      - 'scripts/run-server.ps1'
      - 'start-server.bat'
      - '.github/workflows/test-console-close.yml'
      - 'CHANGELOG.md'
      - 'scripts/version.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-close-protection:
    name: Windows console-close protection test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run smoke test with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-console-close-protection.ps1

      - name: Run smoke test with PowerShell 7
        shell: pwsh
        run: ./scripts/test-console-close-protection.ps1
