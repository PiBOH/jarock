name: test

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'prerequisites/**'
      - '*.bat'
      - 'scripts/server-launch-settings.ini.template'
      - 'server/eula.txt.template'
      - 'server/server.properties.template'
      - 'scripts/version.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-prerequisites-and-server:
    name: Windows first-run bootstrap test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository (with Git LFS installers)
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Java 25 (the runtime the server requires)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Run the first-run bootstrap test
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File ./scripts/test-windows-bootstrap.ps1 *> bootstrap-test.log
          $code = $LASTEXITCODE
          Get-Content bootstrap-test.log
          if ($code -ne 0) {
            $escaped = (Get-Content bootstrap-test.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::bootstrap test failed (exit $code):%0A$escaped"
          }
          exit $code
