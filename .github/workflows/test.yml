name: test

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'prerequisites/**'
      - '*.bat'
      - 'server-launch-settings.ini.template'
      - 'server/eula.txt.template'
      - 'server/server.properties.template'
      - 'version.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-prerequisites-and-server:
    name: Windows first-run bootstrap test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository (with Git LFS installers)
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Java 25 (the runtime the server requires)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run the first-run bootstrap test
        shell: pwsh
        run: ./scripts/test-windows-bootstrap.ps1
