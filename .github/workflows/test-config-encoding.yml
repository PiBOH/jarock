name: test-config-encoding

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/geyser-config.ps1'
      - 'scripts/configure-geyser.ps1'
      - 'scripts/test-configure-geyser.ps1'
      - 'scripts/update-launch-setting.ps1'
      - 'scripts/update-launch-settings.ps1'
      - 'scripts/world-transfer.ps1'
      - 'scripts/clean-server-runtime.ps1'
      - 'scripts/bootstrap-server.ps1'
      - 'scripts/run-server.ps1'
      - 'scripts/validate-launch-settings.ps1'
      - 'scripts/test-settings-encoding.ps1'
      - '.github/workflows/test-config-encoding.yml'
      - 'CHANGELOG.md'
      - 'scripts/version.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-encoding:
    name: Windows config encoding tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Geyser config test with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-configure-geyser.ps1 *> geyser-51.log
          $code = $LASTEXITCODE
          Get-Content geyser-51.log
          if ($code -ne 0) {
            $escaped = (Get-Content geyser-51.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::geyser config 5.1 test failed (exit $code):%0A$escaped"
          }
          exit $code

      - name: Run settings encoding test with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-settings-encoding.ps1 *> settings-51.log
          $code = $LASTEXITCODE
          Get-Content settings-51.log
          if ($code -ne 0) {
            $escaped = (Get-Content settings-51.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::settings encoding 5.1 test failed (exit $code):%0A$escaped"
          }
          exit $code

      - name: Run Geyser config test with PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File ./scripts/test-configure-geyser.ps1 *> geyser-7.log
          $code = $LASTEXITCODE
          Get-Content geyser-7.log
          if ($code -ne 0) {
            $escaped = (Get-Content geyser-7.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::geyser config pwsh test failed (exit $code):%0A$escaped"
          }
          exit $code

      - name: Run settings encoding test with PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File ./scripts/test-settings-encoding.ps1 *> settings-7.log
          $code = $LASTEXITCODE
          Get-Content settings-7.log
          if ($code -ne 0) {
            $escaped = (Get-Content settings-7.log -Tail 40 | ForEach-Object { $_.Replace('%','%25') }) -join '%0A'
            Write-Output "::error::settings encoding pwsh test failed (exit $code):%0A$escaped"
          }
          exit $code
